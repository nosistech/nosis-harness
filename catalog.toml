# Nosis Harness route catalog — DATA, not code (AGENTS.md hard rule).
# Source of truth: NOSIS_HARNESS_Master_Plan.md Appendix B (verified 2026-07-11).
#
# Schema, per route:
#   class               "api" (direct, token-metered) | "delegate" (subscription child CLI — M4)
#   wire                "openai" | "anthropic"
#   modality            array of "text" | "image" | "video" | "audio"
#   context / max_out   tokens; present only where known — never guessed
#   thinking_dialect    "deepseek-nhm" | "kimi-toggle" | "always-thinking" | "glm-hm" | "none"
#   preserve_reasoning  true = reasoning_content always persists across turns (plan A.10.5)
#   preserve_when_thinking true = reasoning_content persists only while thinking is active
#   quirks              wire quirks the adapters match by exact string
#   [routes.<id>.price] currency "CNY"|"USD" · unit "per_million_tokens" ·
#                       cache_hit / cache_miss / output (per M tokens) ·
#                       price_confidence "confirmed"|"reported"|"verify_live" ·
#                       valid_until "YYYY-MM-DD" (quotes flag stale past this date —
#                       honest-cost rule: stale data is flagged, never guessed)
#   [routes.<id>.price.peak]  multiplier · timezone (fixed offset, no DST) ·
#                       windows ["HH:MM-HH:MM", ...] local to that timezone,
#                       start inclusive, end exclusive.

# ------------------------------------------------------------------ DeepSeek (plan B.1)
# Peak = Beijing 09:00-12:00 & 14:00-18:00, 2x on all rates (plan 0.1, confirmed).
# Base rates re-confirmed 2026-07-13 on api-docs.deepseek.com (CNY page matches
# exactly). Peak windows: announced for the mid-July V4 official launch; NOT yet on
# the first-party pricing page as of 2026-07-13 — re-check at valid_until.
# valid_until = 2026-07-24: re-verify once the official V4 launch settles (DeepSeek
# emails 24h before any billing change). The -anthropic variants are the same models
# on the Anthropic Messages wire — the deepclaude-proven agent-loop path (plan A.1).

[routes.deepseek-v4-pro]
provider = "deepseek"
model_id = "deepseek-v4-pro"
base_url = "https://api.deepseek.com"
wire = "openai"
vault_entry = "deepseek"
class = "api"
modality = ["text"]
context = 1000000
max_out = 384000
thinking_dialect = "deepseek-nhm"
preserve_reasoning = false
quirks = ["empty-reasoning-content-on-tool-replay"]

[routes.deepseek-v4-pro.price]
currency = "CNY"
unit = "per_million_tokens"
cache_hit = 0.025
cache_miss = 3.00
output = 6.00
price_confidence = "confirmed"
valid_until = "2026-07-24"

[routes.deepseek-v4-pro.price.peak]
multiplier = 2.0
timezone = "Asia/Shanghai"
windows = ["09:00-12:00", "14:00-18:00"]

