[package]
name = "nh-fleet"
description = "Durable, resumable fleet execution over the agent loop."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = []
test-provider = []

[dependencies]
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
nh-core = { path = "../nh-core", version = "0.2.0" }
nh-law = { path = "../nh-law", version = "0.2.0" }
nh-routes = { path = "../nh-routes", version = "0.2.0" }
nh-tools = { path = "../nh-tools", version = "0.2.0" }
nh-vault = { path = "../nh-vault", version = "0.2.0" }

[dev-dependencies]
tempfile.workspace = true
# This crate depends on itself here so tests/ get the test-provider feature.
# No version on purpose: path = "." always resolves to this crate, so a version
# would just be one more line to bump.
nh-fleet = { path = ".", features = ["test-provider"] }
