[package]
name = "nh-cli"
description = "The nh command line interface for Nosis Harness."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "nh"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
nh-core = { path = "../nh-core", version = "0.2.0" }
nh-fleet = { path = "../nh-fleet", version = "0.2.0" }
nh-law = { path = "../nh-law", version = "0.2.0" }
nh-mcp = { path = "../nh-mcp", version = "0.2.0" }
nh-routes = { path = "../nh-routes", version = "0.2.0" }
nh-tools = { path = "../nh-tools", version = "0.2.0" }
nh-tui = { path = "../nh-tui", version = "0.2.0" }
nh-vault = { path = "../nh-vault", version = "0.2.0" }

[dev-dependencies]
tempfile.workspace = true
nh-fleet = { path = "../nh-fleet", version = "0.2.0", features = ["test-provider"] }
