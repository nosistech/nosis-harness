name: CI

on:
  push:
  pull_request:
  # Manual trigger. A push event can be lost during a platform incident, and the
  # release gate needs a green run on the exact commit being tagged.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-tree:
    name: Public tree and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tracked paths
        run: |
          python3 scripts/test-public-tree.py
          python3 scripts/check-public-tree.py
      - name: Download pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          echo "$scanner_dir" >> "$GITHUB_PATH"
      - name: Scan commit history for secrets
        run: gitleaks git . --log-opts=--all --config .gitleaks.toml --gitleaks-ignore-path /dev/null --redact=100 --no-banner --ignore-gitleaks-allow

  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Format check
        run: cargo fmt --all --check
      - name: Release gate fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\test-release-ci.ps1
      - name: Efficiency report fixtures
        if: runner.os == 'Windows'
        run: python scripts/test-efficiency-report.py
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --release -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps
      - name: Test
        # --no-fail-fast matches gate.ps1. Without it cargo stops at the first failing
        # binary, so a red run reports only part of the suite and hides the rest.
        run: cargo test --locked --workspace --release --no-fail-fast
      - name: Check command reference
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked --release -p nh-cli
          if ($LASTEXITCODE -ne 0) { throw 'CLI build failed.' }
          .\scripts\generate-cli-reference.ps1 -Check

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Cargo deny
        run: cargo deny --locked check
