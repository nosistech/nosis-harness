name: Package Windows

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Packaging safety mode
        required: true
        default: preview
        type: choice
        options:
          - preview
          - release-candidate

permissions:
  contents: read

jobs:
  package:
    name: Windows x64 (${{ inputs.mode }})
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require CI on the exact release source
        if: inputs.mode == 'release-candidate'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          if ($env:GITHUB_REPOSITORY -ne 'nosistech/nosis-harness' -or
              $env:RELEASE_REF -cnotmatch '^refs/tags/v\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:\.[0-9A-Za-z]+)*)?$') {
            throw 'Release candidates must run on a version tag in nosistech/nosis-harness.'
          }
          .\scripts\verify-release-ci.ps1 -SourceCommit $env:RELEASE_SOURCE
      - uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
        with:
          toolchain: "1.96.0"
          targets: x86_64-pc-windows-msvc
      - name: Prepare Windows package
        shell: pwsh
        env:
          PACKAGE_MODE: ${{ inputs.mode }}
        run: |
          if (Test-Path -LiteralPath .\target\dist) {
            throw 'target/dist already exists; refuse to package or upload stale cached artifacts.'
          }
          .\scripts\package-windows.ps1 -Mode $env:PACKAGE_MODE
      - name: Smoke-test packaged bytes
        shell: pwsh
        env:
          PACKAGE_MODE: ${{ inputs.mode }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          $ErrorActionPreference = "Stop"

          $metadataJson = @(& cargo metadata --locked --offline --no-deps --format-version 1)
          if ($LASTEXITCODE -ne 0) {
            throw "cargo metadata failed with exit code $LASTEXITCODE."
          }
          $metadata = ($metadataJson -join [Environment]::NewLine) | ConvertFrom-Json
          $cliPackages = @($metadata.packages | Where-Object { $_.name -eq "nh-cli" })
          if ($cliPackages.Count -ne 1) {
            throw "Expected exactly one nh-cli package."
          }
          $expectedVersion = [string]$cliPackages[0].version
          if ($env:PACKAGE_MODE -eq 'release-candidate' -and
              $env:RELEASE_REF -cne "refs/tags/v$expectedVersion") {
            throw 'The dispatched release tag must exactly match the packaged version.'
          }

          $archives = @(Get-ChildItem -LiteralPath .\target\dist -Recurse -File `
            -Filter "nh-$expectedVersion-windows-x64.zip")
          if ($archives.Count -ne 1) {
            throw "Expected exactly one Windows package ZIP; found $($archives.Count)."
          }
          $archive = $archives[0]
          $packageDir = $archive.Directory.FullName
          $looseExe = Join-Path $packageDir "nh.exe"
          $checksumsPath = Join-Path $packageDir "SHA256SUMS"

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive.FullName)
          try {
            $actualEntries = @($zip.Entries | ForEach-Object { $_.FullName } | Sort-Object)
          } finally {
            $zip.Dispose()
          }
          $expectedEntries = @("LICENSE", "START_HERE.md", "nh.exe") | Sort-Object
          if (@(Compare-Object $expectedEntries $actualEntries).Count -ne 0) {
            throw "The package ZIP does not contain exactly LICENSE, START_HERE.md, and nh.exe."
          }

          $expectedChecksums = @(
            "$((Get-FileHash -LiteralPath $looseExe -Algorithm SHA256).Hash.ToUpperInvariant())  nh.exe"
            "$((Get-FileHash -LiteralPath $archive.FullName -Algorithm SHA256).Hash.ToUpperInvariant())  $($archive.Name)"
          )
          $actualChecksums = @(Get-Content -LiteralPath $checksumsPath | Where-Object { $_.Length -gt 0 })
          if (($actualChecksums -join "`n") -cne ($expectedChecksums -join "`n")) {
            throw "SHA256SUMS does not match the packaged executable and ZIP."
          }

          $smokeDir = Join-Path $env:RUNNER_TEMP ("nosis-package-smoke-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $smokeDir | Out-Null
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $smokeDir
          foreach ($name in $expectedEntries) {
            $loosePath = Join-Path $packageDir $name
            $extractedPath = Join-Path $smokeDir $name
            if (-not (Test-Path -LiteralPath $extractedPath -PathType Leaf)) {
              throw "Extracted package is missing $name."
            }
            if ((Get-FileHash -LiteralPath $loosePath -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath $extractedPath -Algorithm SHA256).Hash) {
              throw "Extracted $name differs from the packaged loose file."
            }
          }

          $smokeExe = Join-Path $smokeDir "nh.exe"
          Push-Location $smokeDir
          try {
            $versionOutput = @(& $smokeExe --version)
            if ($LASTEXITCODE -ne 0) {
              throw "Packaged nh.exe --version failed with exit code $LASTEXITCODE."
            }
            $reportedVersion = ($versionOutput -join [Environment]::NewLine).Trim()
            if ($reportedVersion -ne "nh $expectedVersion") {
              throw "Packaged binary reported '$reportedVersion'; expected 'nh $expectedVersion'."
            }

            $helpOutput = @(& $smokeExe --help)
            if ($LASTEXITCODE -ne 0 -or ($helpOutput -join "`n") -notmatch '(?m)^\s+setup\b') {
              throw "Packaged nh.exe must advertise guided setup."
            }

            & $smokeExe doctor
            if ($LASTEXITCODE -ne 0) {
              throw "Packaged nh.exe doctor failed with exit code $LASTEXITCODE."
            }
            & $smokeExe init
            if ($LASTEXITCODE -ne 0) {
              throw "Packaged nh.exe init failed with exit code $LASTEXITCODE."
            }
            & $smokeExe why "review the diff"
            if ($LASTEXITCODE -ne 0) {
              throw "Packaged nh.exe why failed with exit code $LASTEXITCODE."
            }
          } finally {
            Pop-Location
          }
      - name: Upload package for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nosis-harness-windows-${{ inputs.mode }}-${{ github.sha }}
          path: target/dist
          if-no-files-found: error
          retention-days: 14

  attest:
    name: Attest verified release candidate
    needs: package
    if: inputs.mode == 'release-candidate' && github.repository == 'nosistech/nosis-harness' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download the tested package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nosis-harness-windows-release-candidate-${{ github.sha }}
          path: package
      - name: Validate subjects before attesting
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          executables=(package/release-candidate/*/nh.exe)
          archives=(package/release-candidate/*/nh-*-windows-x64.zip)
          checksums=(package/release-candidate/*/SHA256SUMS)
          [[ ${#executables[@]} -eq 1 && ${#archives[@]} -eq 1 && ${#checksums[@]} -eq 1 ]] || {
            echo 'Expected exactly one executable, ZIP and checksum file before attestation.' >&2
            exit 1
          }
          # Packaging writes CRLF on Windows. Normalize only the verification stream.
          (cd "$(dirname "${checksums[0]}")" && tr -d '\r' < SHA256SUMS | sha256sum --check --strict -)
      - name: Attest executable and ZIP
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          # v4 auto-generates SLSA provenance when no custom predicate/SBOM is supplied.
          subject-path: |
            package/release-candidate/*/nh.exe
            package/release-candidate/*/nh-*-windows-x64.zip
          create-storage-record: false
      - name: Verify both downloaded artifacts against the release source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SOURCE: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          executables=(package/release-candidate/*/nh.exe)
          archives=(package/release-candidate/*/nh-*-windows-x64.zip)
          [[ ${#executables[@]} -eq 1 && ${#archives[@]} -eq 1 ]]
          for artifact in "${executables[@]}" "${archives[@]}"; do
            gh attestation verify "$artifact" \
              --bundle "$ATTESTATION_BUNDLE" \
              --repo nosistech/nosis-harness \
              --predicate-type https://slsa.dev/provenance/v1 \
              --signer-workflow nosistech/nosis-harness/.github/workflows/package-windows.yml \
              --source-ref "$RELEASE_REF" --source-digest "$RELEASE_SOURCE" \
              --deny-self-hosted-runners
          done
      - name: Retain verification bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nosis-harness-attestation-${{ github.sha }}
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 14
