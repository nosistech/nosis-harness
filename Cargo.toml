[workspace]
resolver = "2"
members = [
    "crates/nh-core",
    "crates/nh-routes",
    "crates/nh-tools",
    "crates/nh-vault",
    "crates/nh-law",
    "crates/nh-tui",
    "crates/nh-fleet",
    "crates/nh-mcp",
    "crates/nh-cli",
]

[workspace.package]
version = "0.3.0-rc.1"
edition = "2021"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
zeroize = "1"
getrandom = "0.2"
sha2 = "0.10"
subtle = "2.6"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
clap = { version = "4", features = ["derive"] }
rpassword = "7"
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"], default-features = false }
url = "2"
tiny_http = "0.12"
tempfile = "3"
ratatui = "0.30.2"
crossterm = "0.29"
